# PhotoCraft-specific ARM64 packaging and installation checks.
# The caller remains a reusable workflow so the repository can prepare its dependency patch queue
# before Cargo is touched; the package is intentionally unsigned in this validation route.
name: Windows ARM64

on:
  workflow_call:
    inputs:
      app-name:
        description: Application package name
        type: string
        required: true
      app-dir:
        description: Installed folder name under Program Files
        type: string
        required: true
      wix-version:
        description: WiX toolset version
        type: string
        required: false
        default: "5.0.2"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: ARM64 package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare patched dependencies
        shell: bash
        run: bash scripts/prepare-deps.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-arm64-package-${{ hashFiles('scripts/prepare-deps*.sh', 'patches/**') }}
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: ${{ inputs.wix-version }}
      - name: Build unsigned ARM64 package
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app-name }}-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install and exercise ARM64 package
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.app-name }}-windows-arm64
          path: dist
      - name: Install, inspect, run and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $log = Join-Path $PWD 'install.log'
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec /i exited $($install.ExitCode)" }

          $dir = Join-Path $env:ProgramFiles '${{ inputs.app-dir }}'
          $main = Join-Path $dir '${{ inputs.app-name }}.exe'
          $cli = Join-Path $dir '${{ inputs.app-name }}-cli.exe'
          foreach ($exe in @($main, $cli)) {
            if (-not (Test-Path $exe)) { throw "installer did not place $exe" }
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0xAA64) { throw "$exe is machine 0x$('{0:X}' -f $machine), not ARM64" }
            Write-Output "ok: $exe is ARM64"
          }
          $output = & $cli --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $output; throw "CLI --version exited $LASTEXITCODE" }
          Write-Output "ok: CLI --version ($($output.Trim()))"

          $remove = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "msiexec /x exited $($remove.ExitCode)" }
          if (Test-Path $main) { throw "uninstall left $main behind" }
          Write-Output 'ok: uninstall removed the application'
